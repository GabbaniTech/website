name: CI

on:
    pull_request:
    push:
        branches: [develop, main]

jobs:
    quality:
        name: Quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Formatting, HTML validity, structural completeness gate, and 100%
            # unit-test coverage of the shipped browser JS. Any failure fails the PR.
            - name: Format check
              run: npm run format:check
            - name: HTML validation
              run: npm run validate:html
            - name: Site completeness gate
              run: npm run check:site
            - name: Unit tests + 100% coverage
              run: npm run test:coverage
