name: Update visual baselines

# Regenerate the Playwright screenshot baselines inside the same pinned container
# the visual-regression gate compares against, then commit them back to the
# branch. Use this after an intentional visual change when a local Docker run
# (npm run e2e:docker:update) is not available.

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        name: Regenerate baselines
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}

            - name: Mark workspace safe for git
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

            - name: Regenerate screenshots
              run: npx playwright test --update-snapshots

            - name: Commit and push baselines
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add e2e/__screenshots__
                  if git diff --cached --quiet; then
                      echo "No baseline changes."
                  else
                      git commit -m "Regenerate visual baselines for the rebuild"
                      git push origin "HEAD:${{ github.ref_name }}"
                  fi
