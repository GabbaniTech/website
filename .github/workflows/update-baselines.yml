name: Update visual baselines

# Regenerate the Playwright screenshot baselines without a local Docker setup.
#
# Run it from the Actions tab → "Update visual baselines" → "Run workflow", and
# pick your PR branch. It regenerates the baselines inside the same pinned
# container the visual-regression gate compares against, then commits them back
# to that branch. Use this after an intentional visual change (the alternative is
# `npm run e2e:docker:update` locally, which needs Docker).
#
# Note on re-running the gate: the default GITHUB_TOKEN cannot re-trigger the
# visual-regression workflow on the commit it pushes. To make the gate re-run
# automatically, add a repo secret BASELINE_PAT (a fine-grained PAT with
# contents:write) — it is used here if present. Without it, push any commit (or
# re-run the check) after this workflow finishes.

on:
    workflow_dispatch:
        inputs:
            ref:
                description: 'Branch to update (defaults to the selected branch)'
                required: false

permissions:
    contents: write

jobs:
    update:
        name: Regenerate baselines
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || github.ref_name }}
                  token: ${{ secrets.BASELINE_PAT || github.token }}

            - name: Mark workspace safe for git
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Install dependencies
              run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

            - name: Regenerate screenshots
              run: npx playwright test --update-snapshots

            - name: Commit and push baselines
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add e2e/__screenshots__
                  if git diff --cached --quiet; then
                      echo "Baselines already up to date — nothing to commit." >> "$GITHUB_STEP_SUMMARY"
                  else
                      git commit -m "Regenerate visual baselines"
                      git push origin "HEAD:${{ inputs.ref || github.ref_name }}"
                      echo "Updated baselines pushed to \`${{ inputs.ref || github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
                  fi
