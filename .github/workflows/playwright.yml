name: Visual regression

on:
    pull_request:
    push:
        branches: [develop, main]

jobs:
    visual:
        name: Visual regression
        runs-on: ubuntu-latest
        # Pinned to the @playwright/test version in package.json so screenshots
        # render identically to the committed baselines. Bump both together.
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble
        steps:
            - uses: actions/checkout@v4

            # npm 11 occasionally aborts with "Exit handler never called"; one
            # retry keeps the lockfile-strict install without flaking the gate.
            - name: Install dependencies
              run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

            - name: Playwright tests + screenshot baseline comparison
              run: npx playwright test

            - name: Visual coverage gate
              run: node scripts/check-visual.mjs

            - name: Upload report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
