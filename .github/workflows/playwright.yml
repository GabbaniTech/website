name: Visual regression

on:
    pull_request:
    push:
        branches: [develop, main]

jobs:
    visual:
        name: Screenshots
        runs-on: ubuntu-latest
        env:
            # Single source for the Playwright version; the guard step below fails
            # the build if package.json's pin drifts from it. Keep the container
            # image tag and this value in lockstep when bumping Playwright.
            PW_VERSION: '1.61.1'
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble
        steps:
            - uses: actions/checkout@v4

            - name: Guard — Playwright pin matches the container
              run: |
                  PKG=$(node -p "require('./package.json').devDependencies['@playwright/test']")
                  echo "package.json @playwright/test=$PKG, container=$PW_VERSION"
                  if [ "$PKG" != "$PW_VERSION" ]; then
                      echo "::error::@playwright/test ($PKG) != container image ($PW_VERSION). Bump package.json and the playwright.yml image tag together, then regenerate baselines."
                      exit 1
                  fi

            - name: Cache npm
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ hashFiles('package-lock.json') }}

            # npm 11 occasionally aborts with "Exit handler never called"; one
            # retry keeps the lockfile-strict install without flaking the gate.
            - name: Install dependencies
              run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

            - name: Playwright tests + screenshot baseline comparison
              run: npx playwright test

            - name: Visual coverage gate
              run: node scripts/check-visual.mjs

            - name: Upload report on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
